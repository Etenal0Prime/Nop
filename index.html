<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nop</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#060606;--bone:#ece9e3;--ash:#9a9791;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);overflow:hidden;font-family:'Inter Tight',system-ui,sans-serif;color:var(--bone)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--bone);outline-offset:5px;border-radius:99px}

.gate{position:fixed;inset:0;z-index:10;display:grid;place-content:center;justify-items:center;gap:clamp(22px,4vh,40px);
 background:rgba(6,6,6,.38);-webkit-backdrop-filter:blur(30px) saturate(1.15);backdrop-filter:blur(30px) saturate(1.15);
 transition:opacity 2s cubic-bezier(.4,0,.2,1),-webkit-backdrop-filter 2s cubic-bezier(.4,0,.2,1),backdrop-filter 2s cubic-bezier(.4,0,.2,1)}
.gate.out{opacity:0;pointer-events:none;-webkit-backdrop-filter:blur(0) saturate(1);backdrop-filter:blur(0) saturate(1)}
.gate h1{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:800;font-size:clamp(88px,15vw,200px);line-height:.8;letter-spacing:.01em;user-select:none;
 animation:rise 1.6s .2s cubic-bezier(.2,.7,.2,1) both}
.enter{position:relative;display:flex;align-items:center;gap:14px;padding:16px 34px 16px 26px;border-radius:99px;
 background:rgba(236,233,227,.07);border:1px solid rgba(236,233,227,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 40px rgba(0,0,0,.35);
 -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:15px;letter-spacing:.04em;
 transition:background .35s,border-color .35s,transform .35s cubic-bezier(.2,.7,.2,1);animation:rise 1.6s .5s cubic-bezier(.2,.7,.2,1) both}
.enter::before{content:"";position:absolute;inset:-7px;border-radius:99px;border:1px solid rgba(236,233,227,.16);animation:breathe 3.2s ease-in-out infinite}
.enter:hover,.enter:focus-visible{background:rgba(236,233,227,.15);border-color:rgba(236,233,227,.6);transform:scale(1.04)}
.enter:active{transform:scale(.98)}
.enter svg{width:16px;height:16px;fill:currentColor}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes breathe{50%{transform:scale(1.07);opacity:.35}}

.hud{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
 padding:0 clamp(20px,4vw,56px) calc(clamp(20px,4vh,44px) + env(safe-area-inset-bottom,0px));opacity:0;transform:translateY(12px);transition:opacity 2s 1.2s,transform 2s 1.2s cubic-bezier(.2,.7,.2,1)}
.on .hud{opacity:1;transform:none}
.mark{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:800;font-size:clamp(60px,8vw,112px);line-height:.82;padding-bottom:.22em;user-select:none}
.track{display:flex;align-items:center;gap:12px;margin-top:0;font-size:13px;color:var(--ash)}
.eq{display:flex;align-items:flex-end;gap:4px;height:22px}
.eq i{width:3px;height:100%;background:var(--bone);transform-origin:bottom;transform:scaleY(.15);border-radius:1px;opacity:.85}
.right{display:flex;align-items:center;gap:clamp(18px,3vw,34px);font-size:15px;padding-bottom:4px}
.right a{color:var(--ash);text-decoration:none;transition:color .25s}
.right a:hover,.right a:focus-visible{color:var(--bone)}
.vc{display:flex;align-items:center;border:1px solid rgba(236,233,227,.25);border-radius:99px;padding-right:16px;color:var(--ash);transition:color .25s,border-color .25s}
.vc:hover,.vc:focus-within{color:var(--bone);border-color:rgba(236,233,227,.6)}
.snd{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:inherit}
.vol{--p:90%;-webkit-appearance:none;appearance:none;width:96px;height:38px;background:transparent;cursor:pointer;margin:0}
.vol::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--bone) var(--p),rgba(236,233,227,.22) var(--p))}
.vol::-moz-range-track{height:2px;border-radius:2px;background:rgba(236,233,227,.22)}
.vol::-moz-range-progress{height:2px;border-radius:2px;background:var(--bone)}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;border:0;border-radius:50%;background:var(--bone);box-shadow:0 0 0 0 rgba(236,233,227,.2);transition:box-shadow .25s}
.vol::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--bone)}
.vol:hover::-webkit-slider-thumb,.vol:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(236,233,227,.2)}
.vol:focus-visible{outline:none}
@media (max-width:520px){.vol{width:72px}}
.snd svg{width:16px;height:16px;fill:currentColor}
.snd .x{display:none}.muted .snd .x{display:block}.muted .snd .v{display:none}
@media (prefers-reduced-motion:reduce){.gate h1,.enter,.enter::before{animation:none}.gate,.hud{transition-duration:.01s;transition-delay:0s}}
</style>
</head>

    if(A.g)A.g.gain.setTargetAtTime(m?0:G(),A.ctx.currentTime,.04);
    else if(A.el){A.el.muted=m;A.el.volume=G()}
    document.body.classList.toggle('muted',m)}
  document.getElementById('snd').addEventListener('click',function(){
    A.muted=!A.muted;if(!A.muted&&VOL===0){VOL=.5;sl.value=50;paint()}applyVol()});
  sl.addEventListener('input',function(){VOL=sl.value/100;A.muted=false;paint();applyVol()});
  paint();
})();
</script>
</body>
</html>
